# Entorno LOCAL para probar todo (SQL Server + esquema versionado V001/V002)
# Uso:  docker compose -f docker-compose.local.yml up -d
# MongoDB se usa desde Atlas (ver application.yml / .env del backend analítico).
# Mismo proyecto/volumen que docker-compose.aws.yml -> reutiliza los datos existentes
name: tcc

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agropacayales-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AgroPacayales2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'AgroPacayales2026!' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Aplica la línea base y los cambios versionados (idempotentes: IF NOT EXISTS)
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./ASE251S4_T05-db/db/sqlserver:/scripts:ro
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        SQL="/opt/mssql-tools18/bin/sqlcmd -C -b -S sqlserver -U sa -P AgroPacayales2026!"
        # V001 es idempotente; si la BD ya tenía datos, algún INSERT semilla puede fallar sin afectar el esquema
        $$SQL -i /scripts/bootstrap/V001_baseline.sql || echo 'V001: esquema existente, semillas omitidas'
        $$SQL -d agropacayales_db -i /scripts/bootstrap/V002_auditoria_labores.sql
        echo "Esquema V001 + V002 aplicado"
    restart: "no"

volumes:
  sqlserver_data:
