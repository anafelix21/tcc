name: Docker Hub - Axel (Backend Analitico)

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build & Push Backend Analitico - Axel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_AXEL || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_AXEL || secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_AXEL || secrets.DOCKERHUB_USERNAME }}/agropacayales-backend-analitico:latest
            ${{ secrets.DOCKERHUB_USERNAME_AXEL || secrets.DOCKERHUB_USERNAME }}/agropacayales-backend-analitico:1.0
            ${{ secrets.DOCKERHUB_USERNAME_AXEL || secrets.DOCKERHUB_USERNAME }}/agropacayales-backend-analitico:${{ github.sha }}
