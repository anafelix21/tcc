name: agropacayales-db

x-liquibase: &liquibase
  image: ${IMAGE_NAMESPACE:-hugo454}/ase251s4-t05-db-liquibase:${LAB_VERSION:-local}
  build:
    context: .
    dockerfile: docker/liquibase/Dockerfile
  volumes:
    - ./db:/workspace/db:ro

services:
  sqlserver:
    <<: *liquibase
    environment:
      LIQUIBASE_COMMAND_URL: ${SQLSERVER_URL:-jdbc:sqlserver://localhost:1433;databaseName=agropacayales_db;encrypt=true;trustServerCertificate=true}
      LIQUIBASE_COMMAND_USERNAME: ${SQL_USERNAME:-sa}
      LIQUIBASE_COMMAND_PASSWORD: ${SQL_PASSWORD:-AgroPacayales2026!}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db/sqlserver/changelog.xml

  mongodb:
    <<: *liquibase
    environment:
      LIQUIBASE_COMMAND_URL: ${MONGODB_URL:?Define MONGODB_URL en .env}
      LIQUIBASE_COMMAND_USERNAME: ${MONGODB_USERNAME:-}
      LIQUIBASE_COMMAND_PASSWORD: ${MONGODB_PASSWORD:-}
      LIQUIBASE_COMMAND_CHANGELOG_FILE: db/mongodb/changelog.xml

  checker:
    profiles: [checker]
    image: ${IMAGE_NAMESPACE:-hugo454}/ase251s4-t05-db-checker:${CHECKER_VERSION:-local}
    build:
      context: .
      dockerfile: check/Dockerfile
    environment:
      CHECK_SQLSERVER_URL: ${CHECK_SQLSERVER_URL:-r2dbc:sqlserver://localhost:1433/agropacayales_db}
      SQL_USERNAME: ${SQL_USERNAME:-sa}
      SQL_PASSWORD: ${SQL_PASSWORD:-AgroPacayales2026!}
      MONGODB_URL: ${MONGODB_URL:?Define MONGODB_URL en .env}
      MONGODB_USERNAME: ${MONGODB_USERNAME:-}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-agropacayales_db}
      MONGODB_AUTH_DATABASE: ${MONGODB_AUTH_DATABASE:-admin}
    ports:
      - "${CHECKER_PORT:-8080}:8080"
