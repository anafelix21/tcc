server:
  port: 8080
spring:
  application:
    name: agro-pacayales-liquibase-checker
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
checker:
  sqlserver:
    url: ${CHECK_SQLSERVER_URL:-r2dbc:sqlserver://localhost:1433/agropacayales_db}
    username: ${SQL_USERNAME:-sa}
    password: ${SQL_PASSWORD:-AgroPacayales2026!}
  mongodb:
    url: ${MONGODB_URL}
    username: ${MONGODB_USERNAME}
    password: ${MONGODB_PASSWORD}
    database: ${MONGODB_DATABASE:agropacayales_db}
    authentication-database: ${MONGODB_AUTH_DATABASE:admin}
