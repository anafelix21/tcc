name: Publish WebFlux checker

on:
  push:
    branches: [main]
    paths:
      - check/**
      - demo/generate-manifest.sh
      - demo/new-change.sh
      - tests/**
      - .github/workflows/publish-checker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-checker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate generated contract manifest
        run: ./tests/test-lab.sh

      - name: Calculate immutable tag
        id: version
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::8}"
          release_date="$(TZ=America/Lima git show -s --format=%cd --date=format-local:'%Y.%m.%d' "$GITHUB_SHA")"
          echo "tag=checker-v${release_date}-${short_sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish checker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: check/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ase251s4-t05-db-checker:${{ steps.version.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ase251s4-t05-db-checker:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
          cache-from: type=gha,scope=ase251s4-t05-db-checker
          cache-to: type=gha,mode=max,scope=ase251s4-t05-db-checker
