name: Docker Hub - Ana (Database Liquibase)

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build & Push Liquibase Runner - Ana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_ANA || secrets.DOCKER_USERNAME_ANA || secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN_ANA || secrets.DOCKER_TOKEN_ANA || secrets.DOCKERHUB_PASSWORD_ANA || secrets.DOCKER_PASSWORD_ANA || secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/liquibase/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_ANA || secrets.DOCKER_USERNAME_ANA || secrets.DOCKERHUB_USERNAME }}/ase251s4-t05-db-liquibase:latest
            ${{ secrets.DOCKERHUB_USERNAME_ANA || secrets.DOCKER_USERNAME_ANA || secrets.DOCKERHUB_USERNAME }}/ase251s4-t05-db-liquibase:1.0
