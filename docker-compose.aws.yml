version: '3.8'

services:
  # ============================================================================
  # BASE DE DATOS 2: SQL SERVER 2022 (Transaccional)
  # ============================================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agropacayales-sqlserver
    restart: always
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "AgroPacayales2026!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - agropacayales-net

  # ============================================================================
  # BACKEND 1: Backend Transaccional (Spring Boot WebFlux - Java 21)
  # Swagger: http://<IP>:8081/swagger-ui.html
  # ============================================================================
  backend-transaccional:
    image: anafelixmendoza21/agropacayales-backend:1.0
    container_name: agropacayales-backend-transaccional
    restart: always
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: cloud
      SQL_HOST: sqlserver
      SQL_PORT: 1433
      SQL_DATABASE: agropacayales_db
      SQL_USERNAME: sa
      SQL_PASSWORD: AgroPacayales2026!
      MONGO_URI: mongodb+srv://axelhuapaya_db_user:lider2021@cluster0.oyk6ogs.mongodb.net/?appName=Cluster0
      MONGO_DATABASE: agropacayales_db
    depends_on:
      - sqlserver
    networks:
      - agropacayales-net

  # ============================================================================
  # BACKEND 2: Backend Analítico (Python Flask - KPIs, Cosechas, Merma, Insumos)
  # Swagger: http://<IP>:5000/apidocs
  # ============================================================================
  backend-analitico:
    build:
      context: ./ASE251S4_T05-be-analitico
      dockerfile: Dockerfile
    image: anafelixmendoza21/agropacayales-backend-analitico:1.0
    container_name: agropacayales-backend-analitico
    restart: always
    ports:
      - "5000:5000"
    environment:
      FLASK_PORT: 5000
      FLASK_DEBUG: "False"
      SQL_SERVER: sqlserver
      SQL_PORT: 1433
      SQL_DATABASE: agropacayales_db
      SQL_USER: sa
      SQL_PASSWORD: AgroPacayales2026!
      MONGO_URI: mongodb+srv://axelhuapaya_db_user:lider2021@cluster0.oyk6ogs.mongodb.net/?appName=Cluster0
      MONGO_DB_NAME: agropacayales_db
    depends_on:
      - sqlserver
    networks:
      - agropacayales-net

  # ============================================================================
  # FRONTEND: Web Angular Nginx (Puerto 80)
  # ============================================================================
  frontend-web:
    image: anafelixmendoza21/agropacayales-frontend:1.0
    container_name: agropacayales-frontend-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend-transaccional
      - backend-analitico
    networks:
      - agropacayales-net

volumes:
  sqlserver_data:

networks:
  agropacayales-net:
    driver: bridge
