server {
    listen 80;
    server_name localhost;

    # Resolver DNS interno de Kubernetes K3s (CoreDNS)
    resolver 10.43.0.10 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Archivos estáticos del bundle React + Vite
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso prioritario para Backend 2 Analítico (Python Flask)
    location ^~ /api/v1/analytics/ {
        set $backend_analitico "http://backend-analitico.agropacayales-namespace.svc.cluster.local:5000";
        proxy_pass $backend_analitico$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # Proxy inverso prioritario para Backend 1 Transaccional (Spring WebFlux)
    location ^~ /api/ {
        set $backend_transaccional "http://backend-transaccional.agropacayales-namespace.svc.cluster.local:8081";
        proxy_pass $backend_transaccional$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
