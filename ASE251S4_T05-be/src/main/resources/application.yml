# GUÍA DE ARRANQUE RÁPIDO (Comandos Maven)

# 1. Para arrancar en modo LOCAL (usado por defecto):
#    mvn spring-boot:run
#
# 2. Para arrancar en modo CLOUD (Nube / MongoDB Atlas):
#    mvn spring-boot:run -Dspring-boot.run.profiles=cloud


# CONFIGURACIÓN GENERAL (Común)
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: AgroPacayales-WebFlux
  profiles:
    active: local
  # Configuración Reactiva R2DBC para SQL Server 2022 (Transacciones)
  r2dbc:
    url: ${R2DBC_URL:r2dbc:sqlserver://${SQL_HOST:localhost}:${SQL_PORT:1433}/${SQL_DATABASE:agropacayales_db}?sendStringParametersAsUnicode=false}
    username: ${SQL_USERNAME:sa}
    password: ${SQL_PASSWORD:AgroPacayales2026!}
    pool:
      enabled: true
      # r2dbc-mssql 1.0.x comparte su caché de sentencias preparadas entre conexiones del pool:
      # con más de una conexión ejecuta el handle de una consulta con los parámetros de otra
      # ("The parameterized query ... expects the parameter ..."). Con 1 conexión es estable.
      initial-size: ${R2DBC_POOL_SIZE:1}
      max-size: ${R2DBC_POOL_SIZE:1}
      max-acquire-time: 15s

# Autenticación / autorización JWT
security:
  # true = escritura en /api/** exige token y eliminar/restaurar/importar exige rol ADMIN
  enforce: ${SECURITY_ENFORCE:false}
  jwt:
    secret: ${JWT_SECRET:agropacayales-sprint8-clave-secreta-cambiar-en-produccion}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:28800}

# Conectividad con el Backend 2 Analítico (dentro del clúster: http://backend-analitico-svc:5000)
analytics:
  url: ${ANALYTICS_URL:http://localhost:5000}
  events:
    enabled: ${ANALYTICS_EVENTS_ENABLED:true}

springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    Agropacayales.valleGrande: DEBUG
    org.springframework.data.mongodb.core.ReactiveMongoTemplate: DEBUG
    org.springframework.data.r2dbc: DEBUG
    io.r2dbc.mssql: INFO

---
# PERFIL: LOCAL (Tu computadora / Docker)
spring:
  config:
    activate:
      on-profile: local
  data:
    mongodb:
      # Si tu Mongo local no tiene contraseña, cámbiala a: mongodb://localhost:27017/database_local
      uri: ${MONGO_URI_LOCAL:mongodb://localhost:27017/database_local}
      auto-index-creation: true

---
# PERFIL: CLOUD (MongoDB Atlas - Axel)
spring:
  config:
    activate:
      on-profile: cloud
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://axelhuapaya_db_user:lider2021@cluster0.oyk6ogs.mongodb.net/?appName=Cluster0}
      database: ${MONGO_DATABASE:agropacayales_db}
      auto-index-creation: true