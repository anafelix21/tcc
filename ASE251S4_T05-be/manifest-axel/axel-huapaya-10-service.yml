# kubectl apply -f axel-huapaya-10-service.yml
# kubectl delete -f axel-huapaya-10-service.yml
apiVersion: v1
kind: Service
metadata:
  name: axel-huapaya-10-service
  namespace: axel-huapaya-10-namespace
spec:
  type: NodePort      # 30000-32767  # Cambia a LoadBalancer si estás en un entorno de nube
  ports:
  - port: 30001        # Puerto que el Service expondrá
    targetPort: 8081   # TODO: debe coincidir con SERVER_PORT del Secret/ConfigMap
    nodePort: 30001    # Puerto asignado en el nodo
  selector:
    app: axel-huapaya-10-deployment  # Debe coincidir con las etiquetas del Deployment