# ==============================================================================
# Rutas y Reglas de Red hacia Bases de Datos Externas (Persistencia Políglota)
# Criterio: SQL Server en Amazon RDS (puerto 1433) y MongoDB en EC2 / Atlas (puerto 27017)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: sqlserver-rds
  namespace: agropacayales
spec:
  type: ExternalName
  # Endpoint DNS de la instancia Amazon RDS SQL Server
  externalName: agropacayales-db.c7x...us-east-1.rds.amazonaws.com
  ports:
    - name: mssql
      port: 1433
      targetPort: 1433
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-atlas
  namespace: agropacayales
spec:
  type: ExternalName
  # Endpoint DNS de MongoDB Atlas / EC2
  externalName: cluster0.mongodb.net
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
---
# ==============================================================================
# NetworkPolicy: Reglas de red para restringir y asegurar el tráfico en el clúster
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: permitir-conectividad-interna-y-bd
  namespace: agropacayales
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Permitir tráfico entre los microservicios del namespace agropacayales
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: agropacayales
  egress:
    # 1. Tráfico interno entre Backend 1 y Backend 2 (puerto 5000 y 8081)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5000
        - protocol: TCP
          port: 8081
    # 2. Salida hacia SQL Server Amazon RDS (puerto 1433)
    - ports:
        - protocol: TCP
          port: 1433
    # 3. Salida hacia MongoDB Atlas / EC2 (puerto 27017)
    - ports:
        - protocol: TCP
          port: 27017
    # 4. Tráfico DNS para resolución de nombres de Kubernetes
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
