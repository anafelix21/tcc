apiVersion: v1
kind: ConfigMap
metadata:
  name: agropacayales-config
  namespace: agropacayales
data:
  # Conectividad interna entre microservicios en el clúster
  ANALYTICS_URL: "http://backend-analitico-svc.agropacayales.svc.cluster.local:5000"
  BACKEND_URL: "http://backend-transaccional-svc.agropacayales.svc.cluster.local:8081/api"
  SQL_HOST: "sqlserver-rds.agropacayales.svc.cluster.local"
  SQL_PORT: "1433"
  SQL_DATABASE: "agropacayales_db"
  SERVER_PORT: "8081"
  FLASK_PORT: "5000"
  SECURITY_ENFORCE: "false"
  ANALYTICS_EVENTS_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: agropacayales-secrets
  namespace: agropacayales
type: Opaque
stringData:
  SQL_USERNAME: "sa"
  SQL_PASSWORD: "AgroPacayales2026!"
  JWT_SECRET: "agropacayales-sprint8-clave-secreta-produccion-kubernetes"
  # URI de MongoDB Atlas o EC2 con credenciales
  MONGO_URI: "mongodb+srv://vallegrande:vg2024@cluster0.mongodb.net/agropacayales_db?retryWrites=true&w=majority"
