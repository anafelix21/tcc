# ==============================================================================
# Backend 1: Spring Boot WebFlux (Java 21) — Maestros y Transacciones
# Aislamiento en Nodo Dedicado: role: backend-node (EC2)
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-transaccional
  namespace: agropacayales
  labels:
    app: backend-transaccional
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-transaccional
  template:
    metadata:
      labels:
        app: backend-transaccional
        tier: backend
    spec:
      # Aislamiento de nodos dedicados en EC2 (Rúbrica Orquestadores 1.0 pto)
      nodeSelector:
        role: backend-node
      containers:
        - name: backend-transaccional
          image: anafelixmendoza21/agropacayales-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: agropacayales-config
            - secretRef:
                name: agropacayales-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "cloud"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api-docs
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api-docs
              port: 8081
            initialDelaySeconds: 25
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend-transaccional-svc
  namespace: agropacayales
  labels:
    app: backend-transaccional
spec:
  type: ClusterIP
  selector:
    app: backend-transaccional
  ports:
    - name: http
      port: 8081
      targetPort: 8081
